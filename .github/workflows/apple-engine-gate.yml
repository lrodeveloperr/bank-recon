name: Apple Engine Gate

on:
  push:
    branches: [main, engine-finalize-1-3, app-finalize-1-3, apple-ship-1-3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift 6 / macOS 15
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Resolve package
        run: swift package resolve
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Build SwiftUI app shell
        run: swift build --product bank-reconciliation-app -Xswiftc -warnings-as-errors
      - name: Unit and integration tests
        run: swift test --parallel -Xswiftc -warnings-as-errors
      - name: Plain harness
        run: swift run bank-reconcile verify-fixtures
      - name: Portable reference gates
        run: |
          python3 tools/reference_oracle.py
          python3 tools/static_checks.py
          python3 tools/validate_manifest.py

  universal-apple-app:
    name: Universal app / iOS + iPadOS + macOS
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate icon and Xcode project
        run: tools/generate_apple_project.sh
      - name: Validate submission metadata
        run: |
          plutil -lint App/Info.plist
          plutil -lint App/PrivacyInfo.xcprivacy
          plutil -lint App/BankReconciliation-macOS.entitlements
          python3 -m json.tool App/StoreKit/BankReconciliation.storekit >/dev/null
          xcodebuild -project BankReconciliation.xcodeproj -list
      - name: Build iPhone and iPad app
        run: >-
          xcodebuild -project BankReconciliation.xcodeproj
          -scheme BankReconciliation
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build
      - name: Build Mac app
        run: >-
          xcodebuild -project BankReconciliation.xcodeproj
          -scheme BankReconciliation
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          build
      - name: Run StoreKit and app tests on iOS Simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')"
          xcodebuild -project BankReconciliation.xcodeproj \
            -scheme BankReconciliation \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:BankReconciliationStoreKitTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Produce unsigned validation archives
        run: |
          mkdir -p build-artifacts
          xcodebuild -project BankReconciliation.xcodeproj \
            -scheme BankReconciliation \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build-artifacts/BankReconciliation-iOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          xcodebuild -project BankReconciliation.xcodeproj \
            -scheme BankReconciliation \
            -destination 'generic/platform=macOS' \
            -archivePath "$PWD/build-artifacts/BankReconciliation-macOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Package generated Apple deliverables
        run: |
          ditto -c -k --sequesterRsrc --keepParent BankReconciliation.xcodeproj build-artifacts/BankReconciliation-xcodeproj.zip
          ditto -c -k --sequesterRsrc --keepParent App/Assets.xcassets build-artifacts/BankReconciliation-assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bank-reconciliation-apple-validation
          path: build-artifacts
          retention-days: 14
